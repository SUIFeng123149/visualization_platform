server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: analytics-api
  cache:
    type: simple
  web:
    locale: zh_CN
  datasource:
    # Keep the existing local database as the compatibility default. New v2 deployments
    # should set ANALYTICS_DB_NAME=video_analytics after creating schema_v2.sql.
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/${ANALYTICS_DB_NAME:video_analytics}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.bililens.analytics: DEBUG
    org.springframework.jdbc.core: INFO

analytics:
  platform-admin:
    delete-password: ${PLATFORM_ADMIN_DELETE_PASSWORD:}
  crawler:
    # Point this to the service described by openapi(2).json. Keep it empty until that service is available.
    base-url: ${CRAWLER_BASE_URL:}
    api-key: ${CRAWLER_API_KEY:}
  cache:
    refresh-interval-minutes: 5
  dify:
    base-url: ${DIFY_BASE_URL:http://localhost/v1}
    api-key: ${DIFY_API_KEY:}
    user: ${DIFY_USER:video-analytics-user}
